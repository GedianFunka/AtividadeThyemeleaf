<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Gamers</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black:   #0a0a0f;
            --deep:    #12101a;
            --purple:  #7c3aed;
            --purple-mid: #9d5cf6;
            --purple-light: #c4b5fd;
            --white:   #f5f3ff;
            --gray:    #6b7280;
            --border:  #2a2040;
            --glass:   rgba(124, 58, 237, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--black);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124,58,237,0.25) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(124,58,237,0.04) 39px, rgba(124,58,237,0.04) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(124,58,237,0.04) 39px, rgba(124,58,237,0.04) 40px);
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: var(--deep);
            border-radius: 4px;
            border: 1px solid var(--border);
            padding: 48px 44px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--purple), var(--purple-mid), transparent);
        }

        .container::after {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 12px rgba(124,58,237,0.6));
        }

        h1 {
            font-family: 'Space Mono', monospace;
            color: var(--white);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--gray);
            font-size: 0.9rem;
            font-weight: 300;
        }

        .info-box {
            background: var(--glass);
            border: 1px solid rgba(124,58,237,0.3);
            border-left: 3px solid var(--purple);
            padding: 14px 18px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .info-box p {
            color: var(--purple-light);
            font-size: 0.9rem;
            margin: 0;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--white);
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        label .required {
            color: var(--purple-mid);
            margin-left: 3px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--purple);
            background: rgba(124,58,237,0.07);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
        }

        input::placeholder {
            color: rgba(255,255,255,0.2);
            font-weight: 300;
        }

        /* Remove number arrows */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 4px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: var(--purple);
            color: #fff;
            box-shadow: 0 0 20px rgba(124,58,237,0.35);
        }

        .btn-primary:hover {
            background: var(--purple-mid);
            box-shadow: 0 0 30px rgba(124,58,237,0.55);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--gray);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: rgba(255,255,255,0.2);
            color: var(--white);
            background: rgba(255,255,255,0.04);
        }

        @media (max-width: 600px) {
            .container { padding: 36px 24px; }
            h1 { font-size: 1.3rem; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="form-icon">
            <span th:if="${usuario.id == null}">➕ 🧑‍💻</span>
            <span th:if="${usuario.id != null}">✏️</span>
        </div>
        <h1 th:text="${usuario.id != null} ? 'Editar o Gamer' : 'Novo Gamer'">Novo Gamer</h1>
        <p class="subtitle">Preencha os dados abaixo</p>
    </header>

    <div class="info-box" th:if="${usuario.id != null}">
        <p>💡 Você está editando: <strong th:text="${usuario.nickname}">Nickname</strong></p>
    </div>

    <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="nickname">
                Nickname <span class="required">*</span>
            </label>
            <input type="text"
                   th:field="*{nickname}"
                   id="nickname"
                   placeholder="Digite o nickname completo"
                   required
                   autofocus>
        </div>

        <div class="form-group">
            <label for="email">
                Email <span class="required">*</span>
            </label>
            <input type="text"
                   th:field="*{email}"
                   id="email"
                   placeholder="Digite o seu email"
                   min="0"
                   max="150"
                   required>
        </div>

        <div class="form-group">
            <label for="jogo favorito">
                Jogo favorito <span class="required">*</span>
            </label>
            <input type="text"
                   th:field="*{jogoFavorito}"
                   id="jogo favorito"
                   placeholder="Digite seu Jogo favorito"
                   min="0"
                   max="150"
                   required>

        </div>

        <div class="form-group">
            <label for="nivel"> Nivel <span class="required">*</span>
            </label>
            <input type="number"
                   th:field="*{nivel}"
                   id="nivel"
                   placeholder="Digite seu nivel"
                   min="0"
                   max="150"
                   required>

        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">
                <span th:text="${usuario.id != null} ? '💾 Atualizar' : '💾 Salvar'">💾 Salvar</span>
            </button>
            <a th:href="@{/usuarios/}" class="btn btn-secondary">❌ Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
